name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read runtime toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 45090495342: slowest green 6s; under 2.5 minutes, so the 5-minute floor.
    outputs:
      node_matrix: ${{ steps.matrix.outputs.node_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared reader
        run: scripts/toolchain.sh --self-test
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"
      - name: Compose the qualification matrix
        id: matrix
        env:
          NODE: ${{ steps.versions.outputs.nodejs }}
          NODE_LANES: ${{ steps.versions.outputs.nodejs_lanes }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          lanes = [{"lane": "primary", "node": os.environ["NODE"]}]
          lanes.extend({"lane": "minimum", "node": node} for node in json.loads(os.environ["NODE_LANES"]))
          print("node_matrix=" + json.dumps({"include": lanes}, separators=(",", ":")))
          PYTHON

  verify:
    needs: toolchain
    name: typecheck, test, build (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 41587842713: source checks took 68s; under 2.5 minutes, so the 5-minute floor for short jobs.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.node_matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.toolchain.outputs.bun }}
          no-cache: true

      - name: Refuse Bun runtime drift
        env:
          EXPECTED_BUN: ${{ steps.toolchain.outputs.bun }}
        run: scripts/toolchain.sh --installed "bun=$EXPECTED_BUN"

      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Audit high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Check source, conformance and the packed package
        env:
          CAP_REQUIRE_BUN: "1"
        run: |
          npm run typecheck
          npm run test
          npm run self-checks
          npm run check:reference
          npm run check:package

  reference:
    name: Published Elixir report agreement
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # Run 44077949078: reference agreement took 20s; under 2.5 minutes, so the 5-minute floor for short jobs.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.toolchain.outputs.bun }}
          no-cache: true

      - name: Refuse Bun runtime drift
        env:
          EXPECTED_BUN: ${{ steps.toolchain.outputs.bun }}
        run: scripts/toolchain.sh --installed "bun=$EXPECTED_BUN"

      - name: Install with the frozen lockfile
        run: npm ci
      - name: Build the verifier
        run: npm run build
      - name: Compare the published Elixir and TypeScript reports
        run: npm run check:reference -- --report

  site:
    name: Typecheck and build the static site
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 42651891950: the former Pages build took 20s; under 2.5 minutes, so the 5-minute floor for short jobs.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Install with the frozen lockfile
        run: npm ci
      - name: Typecheck the site
        run: npm run typecheck:web
      - name: Build the site
        run: npm run build:site

  qualified:
    if: always()
    needs: [toolchain, verify, reference, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44190196993: slowest green 4s; under 2.5 minutes, so the 5-minute floor.
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
