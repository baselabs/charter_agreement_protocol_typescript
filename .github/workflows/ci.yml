name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build, vendored conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun (runtime whose ML-DSA keys report no type)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit + tamper tests
        env:
          CAP_REQUIRE_BUN: "1"
        run: npm test

      - name: Self-check battery
        run: npm run self-checks

      - name: Build
        run: npm run build

      - name: Vendored certified corpus through the built CLI
        run: node dist/cli.js --corpus conformance

      - name: Pack (content boundary)
        run: npm pack --dry-run
