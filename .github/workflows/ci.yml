name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build, vendored conformance
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["24.8.0", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Bun (runtime whose ML-DSA keys report no type)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Complete source, package and documentation checks
        env:
          CAP_REQUIRE_BUN: "1"
        run: npm run check
  reference:
    name: Published Elixir 1.0 report agreement
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up the Elixir reference runtime
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.3"
      - run: npm ci
      - run: npm run build
      - run: npm run check:reference -- --report
