name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the inspected archive with provenance
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Refuse a tagged version
        id: package
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {appendFileSync, readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `v${version}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', `v${version} is already tagged`);
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\nversion=${version}\n`);
          JAVASCRIPT
      - name: Build the library and documentation site
        run: |
          npm run build
          npm run build:site
      - name: Inspect the exact package archive
        run: npm run check:package
      - name: Verify the inspected archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Refuse a package whose changelog is not stamped for its version
        env:
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          python3 -I - ./artifacts/package.tgz "$VERSION" <<'PY'
          import io, re, sys, tarfile
          archive, version = sys.argv[1], sys.argv[2]
          def refuse(message):
              raise SystemExit(f'{archive}: {message}; publication refused')
          with tarfile.open(archive, 'r:*') as outer:
              if 'contents.tar.gz' in outer.getnames():
                  package = tarfile.open(fileobj=io.BytesIO(outer.extractfile('contents.tar.gz').read()), mode='r:gz')
                  root = ''
              else:
                  package, root = outer, 'package/'
              found = [member for member in package.getmembers() if member.isfile()
                       and re.fullmatch(re.escape(root) + r'(?i:changelog(?:\.md|\.markdown|\.txt)?)', member.name)]
              if len(found) != 1:
                  refuse('the package must ship exactly one root CHANGELOG')
              try:
                  lines = package.extractfile(found[0]).read().decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  refuse('the packaged CHANGELOG is not UTF-8')
          headings, fence = {}, False
          for index, line in enumerate(lines):
              if re.match(r' {0,3}(```|~~~)', line):
                  fence = not fence
              elif not fence and (match := re.match(r' {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$', line)):
                  headings[index] = (len(match.group(1)), match.group(2) or '')
          token = re.compile(r'(?<![0-9A-Za-z.+-])v?' + re.escape(version) + r'(?![0-9A-Za-z.+-])')
          stamped = [index for index, (_, title) in headings.items() if token.search(title)]
          if not stamped:
              refuse(f'the packaged CHANGELOG has no section for {version}')
          at, level = stamped[0], headings[stamped[0]][0]
          def written(start):
              end = next((index for index, (depth, _) in headings.items() if index > start and depth <= level), len(lines))
              return any(line.strip() for index, line in enumerate(lines[start + 1:end], start + 1) if index not in headings)
          if not written(at):
              refuse(f'the packaged CHANGELOG section for {version} is empty')
          for start, (depth, title) in headings.items():
              if start < at and depth == level and written(start):
                  refuse(f'the packaged CHANGELOG has entries above {version}, under "{title}"')
          print(f'{archive}: the packaged CHANGELOG is stamped for {version}')
          PY

      - name: Plan only missing registry uploads
        id: plan
        env:
          RELEASE_NAME: ${{ steps.package.outputs.name }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: node scripts/npm-release-state.mjs --plan "$RELEASE_NAME" "$RELEASE_VERSION" ./artifacts/package.tgz
      - name: Preserve the consumer-verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            artifacts/package.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish to npm with trusted publishing
        if: steps.plan.outputs.state == 'upload'
        run: npm stage publish ./artifacts/package.tgz --provenance --ignore-scripts --access public --registry=https://registry.npmjs.org/
      - name: Read back the served archive integrity
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          RELEASE_NAME: ${{ steps.package.outputs.name }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: node scripts/npm-release-state.mjs --served "$RELEASE_NAME" "$RELEASE_VERSION" ./artifacts/package.tgz
