name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the inspected archive with provenance
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 3 # Run 38507722154: the former publication job took 66s.
    environment: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node from the tool versions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Refuse a different Node version
        run: |
          expected="$(awk '$1 == "nodejs" {print $2}' .tool-versions)"
          test "$(node --version)" = "v$expected" || { echo "::error::Node must be exactly $expected"; exit 1; }
      - name: Require qualification for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          repository, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          runs = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repository}/actions/workflows/ci.yml/runs?head_sha={sha}&event=push&status=success&per_page=100'
          ]))['workflow_runs']
          if not any(run['head_sha'] == sha and run['event'] == 'push'
                     and run['head_branch'].startswith('kci/') and run['conclusion'] == 'success'
                     for run in runs):
              raise SystemExit('Publication refused: this commit needs a green kci qualification run')
          PYTHON
      - name: Pin archive tooling
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install with the frozen lockfile
        run: npm ci
      - name: Refuse a published or tagged version
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync, spawnSync} from 'node:child_process';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = spawnSync('npm', ['view', `${name}@${version}`, 'version', '--json', '--registry=https://registry.npmjs.org/'], {encoding: 'utf8'});
          assert.notEqual(result.status, 0, `${name}@${version} is already published`);
          assert.equal(JSON.parse(result.stdout).error?.code, 'E404', 'registry lookup failed without confirming an unpublished version');
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `v${version}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', `v${version} is already tagged`);
          JAVASCRIPT
      - name: Build the library and documentation site
        run: |
          npm run build
          npm run build:site
      - name: Inspect the exact package archive
        run: npm run check:package
      - name: Verify the inspected archive checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish to npm with trusted publishing
        run: npm publish ./artifacts/package.tgz --provenance --ignore-scripts --access public --registry=https://registry.npmjs.org/
